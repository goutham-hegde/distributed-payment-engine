# Shared proxy settings, included by every backend location in nginx.conf.
#
# Factored out because a setting that has to be repeated four times is a setting that will one day
# be repeated three times.

proxy_http_version 1.1;

proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;

# Generous enough for a chaos run: the gateway's simulation can inject latency on purpose, and a
# proxy timing out at nginx's 60s default would present an injected delay as a UI failure - the
# console would be lying about the thing it was built to observe.
proxy_connect_timeout 5s;
proxy_send_timeout    120s;
proxy_read_timeout    120s;

# No buffering. Responses here are small JSON documents and the console polls them; buffering adds
# latency to exactly the readings whose freshness is the point.
proxy_buffering off;
