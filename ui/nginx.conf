# M6.5. One origin in front of three services.
#
# The alternative was to let the browser call localhost:8081, :8082 and :8083 directly and enable
# CORS on all three. That is worse on both counts this project cares about: it puts a browser
# concern into three server configurations, and CORS is a policy about who may READ a response -
# it is not, and is routinely mistaken for, an authorization mechanism. Every rule that decides
# who may do what stays in SecurityConfig, where M5 put it.
#
# A reverse proxy is also what actually sits in front of a service estate, so the shape here is
# the shape the real thing has: one public origin, path-prefixed backends, and the services
# themselves unaware they are behind anything.

server {
    listen 80;
    server_name _;

    # Never cache index.html. The hashed asset filenames Vite emits are immutable and cached
    # forever below; index.html is the file that NAMES them, so a stale copy points a returning
    # browser at assets that were deleted by the last deploy. It fails as a blank page with a
    # 404 in the console, which reads as an application bug.
    location = /index.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-store" always;
    }

    location /assets/ {
        root /usr/share/nginx/html;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # ---------------------------------------------------------------------------------------
    # The three services. The prefix is stripped, so /api/orchestrator/auth/token reaches the
    # orchestrator as /auth/token - the service's own path, unchanged, and no service needs to
    # know its public prefix.
    #
    # Note what is NOT here: no `proxy_set_header Authorization`. The browser sends the bearer
    # token on the request and nginx forwards request headers by default. An explicit line would
    # imply this proxy holds or rewrites a credential, and it holds nothing - which is the
    # property that keeps it a router rather than a trusted component.
    # ---------------------------------------------------------------------------------------

    location /api/orchestrator/ {
        proxy_pass http://payment-orchestrator:8081/;
        include /etc/nginx/dpe-proxy.conf;
    }

    location /api/accounts/ {
        proxy_pass http://account-service:8082/;
        include /etc/nginx/dpe-proxy.conf;
    }

    location /api/gateway/ {
        proxy_pass http://payment-gateway:8083/;
        include /etc/nginx/dpe-proxy.conf;
    }

    # Prometheus's query API, for the System view's backlog/lag/alert panels.
    #
    # This is the one route with no authentication behind it, and it is a deliberate, bounded
    # decision rather than an oversight:
    #
    #   * Prometheus has no authentication to pass through - it never has, by design; its own docs
    #     say to put it behind a proxy. There is no credential being dropped here.
    #   * It is already published on the host at :9090 by infra/docker-compose.yml, so this route
    #     widens nothing that was not already open on this machine.
    #   * What it exposes is aggregate operational data - queue depths, rates, alert states - and
    #     never a row of the ledger. The endpoints that can name an account or a transfer are the
    #     three above, and all of them are behind the M5 rules.
    #
    # It is still the first thing to close if this ever leaves a laptop, and the honest note is
    # that the metrics carry no per-customer labels precisely BECAUSE of the M6 cardinality rule -
    # a decision made for memory that happens to bound this too.
    #
    # Read-only in the strict sense: only /api/v1/query and /api/v1/query_range are routed, so the
    # admin API (which can DELETE series) is not reachable even though it is disabled anyway.
    location ~ ^/api/prom/api/v1/(query|query_range|rules|alerts)$ {
        rewrite ^/api/prom/(.*)$ /$1 break;
        proxy_pass http://prometheus:9090;
        include /etc/nginx/dpe-proxy.conf;
    }

    # The SPA fallback. Any path that is not a file and not an API route serves index.html, so a
    # deep link like /#/transfer/<id> survives a refresh. It must come last: a `try_files` block
    # placed above the API locations would swallow them.
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
