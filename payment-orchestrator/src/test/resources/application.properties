# M5: test-only configuration.
#
# In its own file rather than in each @SpringBootTest's properties, because of the trap M4 found:
# @SpringBootTest properties do NOT merge down a class hierarchy - Spring takes the first
# declaration it finds and ignores the rest - so a key added to a base class quietly disappears
# from any subclass that re-declares its own properties. A test-classpath application.properties
# is merged with the main application.yml by normal config-data precedence and cannot be lost
# that way.
#
# M5 part 2: there is no shared secret any more. Services verify with a PUBLIC key, and the
# private half exists only inside payment-orchestrator. The orchestrator's tests use the key it
# generates at startup; account-service and payment-gateway are handed a generated test public key
# through @DynamicPropertySource in their AbstractPostgresIT, because it cannot be written here -
# it does not exist until the JVM starts.

# The dev directory the AuthController tests log in against. Same shape as application.yml, with
# values that never leave the test JVM.
dpe.auth.token-ttl=15m
dpe.auth.users.alice.password=alice-password
dpe.auth.users.alice.roles[0]=USER
dpe.auth.users.bob.password=bob-password
dpe.auth.users.bob.roles[0]=USER
dpe.auth.users.operator.password=operator-password
dpe.auth.users.operator.roles[0]=OPERATOR

# M6: collapse the actuator back onto the application port for the test suite.
#
# In production the actuator listens on its own connector and SecurityConfig#managementChain
# permits it, because Compose does not publish that port. A test JVM has no such network boundary,
# so opening a second unauthenticated connector here would be a hole that exists only in tests -
# and, worse, would silently REPLACE the M5 rule the actuator security tests are asserting.
#
# With management.server.port equal to server.port there is no second connector,
# ManagementPortMatcher matches nothing, and /actuator/** is operator-only exactly as M5 left it.
# That is the fail-closed branch of the matcher, exercised by the whole suite on every run.
#
# ManagementPortSecurityIT is the exception: it sets a real, distinct port through
# @DynamicPropertySource and asserts the two-connector posture directly.
management.server.port=8081

# M6: the Redis health indicator is off for the test suite, and this fixed a test that had been
# passing for the wrong reason since M4.
#
# AdminEndpointSecurityTest asserts GET /actuator/health == 200 to show the probe endpoint needs no
# token. But Boot's RedisHealthIndicator probes Redis regardless of dpe.idempotency.cache=false -
# the cache being switched off does not remove the connection factory - and a DOWN component makes
# the whole endpoint 503. These tests run with no Redis, so the assertion only held when something
# happened to be listening on localhost:6379, which on this machine meant "Docker Compose was up
# in another window". It passed through all of M4 and M5 that way and failed the first time the
# suite ran on a clean machine.
#
# The test is about AUTHORIZATION - that health is reachable without a credential - so the health
# of a dependency these tests deliberately do not run is noise in it. Off here; untouched in
# production, where a DOWN Redis genuinely should show.
management.health.redis.enabled=false

# M6: the metrics refreshers are off for tests, like every other background timer here.
#
# MessagingMetricsScheduler and SagaMetricsScheduler only READ, so leaving them on could not
# corrupt anything - but a timer firing queries at a table a test is truncating produces log
# noise and the occasional confusing stack trace, and a gauge refreshed behind an assertion
# makes that assertion depend on thread scheduling. The tests that care call refresh() directly,
# which is also the only way to assert on a value at a known point.
#
# In this file rather than in a @SpringBootTest properties list, for the M4 reason: those do not
# merge down a class hierarchy, so a subclass re-declaring its own would silently turn these back
# on.
dpe.metrics.scheduled=false

# M8: admission control is effectively off for the suite.
#
# The estimate lives in a singleton bean and is only corrected by a recount, while
# AbstractPostgresIT truncates saga_instances under it before every test and most tests leave
# their sagas in flight on purpose (the relay and sweeper are off). A real limit would make one
# class's leftovers refuse another class's payments, depending on test order. AdmissionControlTest
# sets a small limit of its own with @TestPropertySource, which - unlike @SpringBootTest
# properties - does not wipe the base class's list.
dpe.admission.max-in-flight=1000000

# M6 part 2: tracing in the test suite.
#
# Sampling at 1.0 because a probabilistic sampler makes a propagation assertion flaky in the worst
# possible way - green on the machine it was written on, red once in ten runs in CI, for a reason
# that looks like the code. The tests assert on trace CONTEXT, which propagates whether or not the
# trace is sampled, but the sampled flag is part of `traceparent` and asserting on a value that is
# sometimes 01 and sometimes 00 is not worth the cleverness.
management.tracing.sampling.probability=1.0

# Export OFF. Spans are still created, still propagate, and still carry through the outbox - all
# of which is what the tests are about - but nothing is shipped anywhere. Left on, every test JVM
# opens a batch exporter against localhost:4318, retries against a port nothing is listening on,
# and prints a stack trace per flush interval into a suite that has no collector by design.
#
# NOTE THE KEY. Boot 4.0 renamed this family: `management.otlp.tracing.export.enabled` is
# deprecated at ERROR level and does not bind, so setting the old one leaves export ON while
# looking like it turned it off.
management.tracing.export.otlp.enabled=false

# M8, S22: NO ROUTE FROM A TEST TO THE DEVELOPER'S RUNNING STACK.
#
# Every default in application.yml points at localhost, and Compose publishes the broker (29092),
# Postgres (5432) and Redis (6379) on localhost. A test context with no Testcontainers connection
# for one of them therefore talked to the LIVE one whenever the stack was up - measured: one
# full verify joined the live account-service consumer group 18 times and the live
# payment-orchestrator group 24 times. A test consumer in a live group takes partitions, processes
# live commands against the TEST database, and commits their offsets, so the running service never
# sees them. `auto-startup=false` does not prevent it: Spring Framework 7 pauses cached test contexts
# and restarts them on reuse, and spring-kafka's registry starts EVERY container on a start() after
# refresh (alwaysStartAfterRefresh, default true) - whatever auto-startup said.
#
# So nothing here has a default that reaches anything. Port 9 is discard; nothing listens on it.
# A base class with a container overrides these through @ServiceConnection, which wins over
# properties. A test that silently depended on the live stack now fails, which is the point.
spring.kafka.bootstrap-servers=127.0.0.1:9
# ...and do not try to create topics at startup against the address above: KafkaAdmin would wait
# out its timeout in every context. The Kafka test bases turn it back on.
spring.kafka.admin.auto-create=false
spring.datasource.url=jdbc:postgresql://127.0.0.1:9/no-route-to-the-dev-stack
spring.data.redis.host=127.0.0.1
spring.data.redis.port=9
