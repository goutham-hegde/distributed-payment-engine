spring:
  application:
    name: payment-orchestrator

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/payments_db}
    username: ${DB_USER:payments}
    password: ${DB_PASSWORD:payments}
    hikari:
      maximum-pool-size: 10
      pool-name: orchestrator-pool

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  # M4: the idempotency fast path. NOT a dependency - see IdempotencyCache. The timeouts are
  # short on purpose: this client sits on the request path, and a Redis that has become slow must
  # degrade into a cache miss within milliseconds rather than adding its latency to every write.
  # A long timeout here would make an optional component able to take the API down.
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 200ms
      connect-timeout: 200ms
      repositories:
        # Off, because there are none and there never will be. Left on, Spring Data Redis scans
        # for repositories at startup and inspects every JPA repository in this service trying to
        # decide whether it belongs to Redis - which is five INFO lines of "could not safely
        # identify store assignment" on every boot, for a store that holds no entities at all.
        #
        # Worth switching off rather than tolerating: multi-store repository scanning resolves
        # ambiguity by GUESSING, and the day someone adds an entity that both stores could claim,
        # the guess is silent. Naming the one store that owns repositories here removes the
        # ambiguity instead of hoping it stays benign.
        enabled: false

  # M2: consumes the events account-service relays out of its outbox.
  # M3: also PRODUCES, because the saga issues commands through an outbox of its own.
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:19092}

    # Identical to account-service's producer block, and identical on purpose: these settings
    # are what make the outbox's guarantee true, so they are not a per-service preference.
    # See account-service/src/main/resources/application.yml for what each one buys.
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      retries: 2147483647
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        # Stays 'none' until the base image changes. Every codec except gzip decompresses
        # through a glibc-linked JNI library and the runtime image is Alpine/musl; the failure
        # happens inside consumer.poll(), below every error handler, and wedges the partition
        # permanently. M2 hit this for real.
        compression.type: none
        linger.ms: 5
        request.timeout.ms: 3000
        # Below the relay's send-timeout, so the send future always completes on its own rather
        # than being abandoned while the producer is still retrying in the background.
        delivery.timeout.ms: 4000
    consumer:
      # One group for the whole service. Every instance shares it, so Kafka gives each instance a
      # disjoint set of partitions: scaling out divides the work instead of duplicating it.
      group-id: payment-orchestrator

      # Start from the beginning of a topic this group has never read. The alternative,
      # 'latest', silently discards everything published before the consumer first started -
      # which on a fresh deployment means losing every event already in the log.
      auto-offset-reset: earliest

      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

      # THE setting that decides whether this system can lose money.
      #
      # Left at its default of true, the client commits offsets on a five-second timer, with no
      # knowledge of whether the handler ran, succeeded, or committed its transaction. A crash
      # after an auto-commit and before the work is durable loses the message permanently: Kafka
      # believes it was delivered and will never send it again. That is at-most-once.
      #
      # False means nothing is committed until AccountEventConsumer calls acknowledge(), which it
      # does only after the handler's transaction has committed. Redelivery after a crash is then
      # guaranteed - and absorbed by the inbox.
      enable-auto-commit: false

      # Small batches, so a redelivery after a crash replays little.
      max-poll-records: 50

      properties:
        # Never let a subscribe() conjure the topic. A consumer that reaches an undeclared topic
        # first has the broker auto-create it with the broker's defaults - one partition - and is
        # then assigned only that partition, while the producer keys messages across all three.
        # Two thirds of the traffic silently goes unread until a metadata refresh five minutes
        # later. Nothing throws; the system just appears quiet. See KafkaTopicsConfig.
        allow.auto.create.topics: false

    listener:
      # Hands the listener an Acknowledgment and commits only when it is used.
      # MANUAL_IMMEDIATE rather than MANUAL: it commits at the point of the call instead of
      # deferring to the end of the poll batch, which keeps test assertions honest about what
      # has actually been committed.
      ack-mode: manual_immediate

# M3 relay tuning. See OutboxProperties for what each knob trades away.
dpe:
  outbox:
    batch-size: 100
    poll-interval: 500ms
    send-timeout: 5s
    # Tests turn this off and call drainBatch() directly, so nothing races them.
    scheduled: true

  saga:
    # How long a saga may sit in a non-terminal state before the sweeper forces compensation.
    #
    # This is a POLICY number and the most consequential one in the milestone. Too short and a
    # merely slow account-service gets its perfectly good reserve compensated out from under it,
    # producing a spurious failure and, worse, a release racing a late commit. Too long and money
    # sits stranded in a hold for that long whenever a participant dies. It must comfortably
    # exceed the p99 of a full round trip - relay poll interval, broker, consumer poll, the
    # gateway's own latency - and 30s is that with room to spare while staying observable in a
    # test.
    step-timeout: 30s
    # How often to look for expired sagas. The sweep is one indexed query against a partial
    # index containing only in-flight sagas, so it is cheap enough to run often.
    sweep-interval: 5s
    # Cap on how many times the sweeper will try to drive one saga to a terminal state before
    # leaving it alone and letting it be alerted on. Without a cap, a saga that cannot be
    # compensated is swept forever and the log fills with the same failure.
    max-sweep-attempts: 5
    # Sagas claimed per sweep. Bounded for the same reason the outbox batch is: the claim
    # transaction stays open across the whole batch.
    sweep-batch-size: 100
    # Tests turn this off and call sweep() directly, so a background thread cannot race them.
    scheduled: true

  # M4. Every one of these is policy, not tuning - see IdempotencyProperties.
  idempotency:
    # How long a key is honoured. Published API contract: a retry after this is a new payment.
    retention: 24h
    # Redis keeps its copy no longer than Postgres keeps the row, or the cache would answer for
    # a key the database has already forgotten.
    cache-ttl: 24h
    # The master switch. Off must change nothing but latency; the tests prove it.
    cache: true
    # Short lease. It is an optimization, and a crashed holder must not block its own retries for
    # longer than one request takes.
    lock-ttl: 3s
    # How long a caller that lost the lock waits for the winner answer before going to Postgres
    # regardless. Never refuse, never wait forever.
    lock-wait: 500ms
    # M4 part 2: garbage collection for expired keys. Frequent and small, because this table
    # is on the path of every write request and a rare enormous DELETE locks exactly the rows
    # the gate is trying to read.
    sweep-interval: 5m
    sweep-batch-size: 500
    # Tests turn this off and call sweep() directly, so nothing races them.
    scheduled: true

  # M4 part 2: retry and dead letter policy. See DeadLetterProperties for what each knob trades.
  dlq:
    # Four deliveries total, not four retries. Enough to ride out a pod restart or a brief
    # database failover; not enough for a poison message to hold its partition for long.
    max-attempts: 4
    initial-interval: 500ms
    multiplier: 2
    # Ceiling on one wait. maxAttempts x maxInterval is time the consumer is NOT polling, and
    # exceeding max.poll.interval.ms (5 minutes) makes the broker evict this consumer and
    # rebalance - which hands the partition to an instance that starts the budget again at zero.
    max-interval: 5s
    replay-batch-size: 50

  # M5: token verification. This service is the ISSUER, so it verifies with the key it signs
  # with - directly, in memory, rather than fetching its own JWKS endpoint over HTTP. Hence
  # neither jwk-set-uri nor public-key here: AuthConfig supplies the decoder. See JwtConfig for
  # the two configured paths the other services use.
  security:
    issuer: dpe
    audience: dpe-api
    clock-skew: 30s

  # M5: the ISSUING side, and it exists only in this service. A real deployment replaces this
  # with an identity provider and changes nothing else - validation is local everywhere.
  auth:
    # The revocation policy, stated as a duration. A stateless token cannot be withdrawn, so a
    # leaked one is valid for exactly this long. Fifteen minutes is the usual compromise between
    # that exposure and asking a user to log in constantly.
    token-ttl: 15m

    # THE SIGNING KEY. RSA private key (base64 PKCS#8) and its public half (base64 X.509).
    #
    # No default and no value in this file - the same rule the HS256 secret had, and for a
    # stronger reason: this one key is the ability to mint any identity in the system.
    #
    # Left unset, SigningKeys GENERATES a pair at startup and logs a warning. That keeps
    # `docker compose up` working with no key ceremony, and it is safe in a way a committed key
    # would not be, because the key never existed before the process and does not outlive it.
    # What a generated key cannot do: survive a restart (every token in flight is invalidated),
    # or be shared by two instances (each would sign with its own, and validators would reject
    # tokens from whichever one they had not fetched from). Configure a pair for anything real.
    private-key: ${DPE_AUTH_PRIVATE_KEY:}
    public-key: ${DPE_AUTH_PUBLIC_KEY:}

    # DEVELOPMENT DIRECTORY. Fake people, fake passwords, plain text - a real user store holds a
    # slow hash (bcrypt/argon2) and lives in a database, and nothing here should be mistaken for
    # one. The subjects are deliberately the same strings as accounts.owner_id, which is what
    # lets `sub` be compared directly against ownership with no mapping table in between.
    users:
      alice:
        password: ${DEV_PASSWORD_ALICE:alice-password}
        roles: [USER]
      bob:
        password: ${DEV_PASSWORD_BOB:bob-password}
        roles: [USER]
      # Reads the operational surfaces and replays dead letters. Cannot move money - not by
      # policy in a document, but because AccountOwnershipGuard has no role bypass and this
      # subject owns no accounts.
      operator:
        password: ${DEV_PASSWORD_OPERATOR:operator-password}
        roles: [OPERATOR]

server:
  port: ${SERVER_PORT:8081}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true

logging:
  level:
    com.dpe: DEBUG
