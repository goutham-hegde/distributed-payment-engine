spring:
  application:
    name: payment-orchestrator

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/payments_db}
    username: ${DB_USER:payments}
    password: ${DB_PASSWORD:payments}
    hikari:
      maximum-pool-size: 10
      pool-name: orchestrator-pool

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  # M4: the idempotency fast path. NOT a dependency - see IdempotencyCache. The timeouts are
  # short on purpose: this client sits on the request path, and a Redis that has become slow must
  # degrade into a cache miss within milliseconds rather than adding its latency to every write.
  # A long timeout here would make an optional component able to take the API down.
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 200ms
      connect-timeout: 200ms
      repositories:
        # Off, because there are none and there never will be. Left on, Spring Data Redis scans
        # for repositories at startup and inspects every JPA repository in this service trying to
        # decide whether it belongs to Redis - which is five INFO lines of "could not safely
        # identify store assignment" on every boot, for a store that holds no entities at all.
        #
        # Worth switching off rather than tolerating: multi-store repository scanning resolves
        # ambiguity by GUESSING, and the day someone adds an entity that both stores could claim,
        # the guess is silent. Naming the one store that owns repositories here removes the
        # ambiguity instead of hoping it stays benign.
        enabled: false

  # M2: consumes the events account-service relays out of its outbox.
  # M3: also PRODUCES, because the saga issues commands through an outbox of its own.
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:19092}

    # Identical to account-service's producer block, and identical on purpose: these settings
    # are what make the outbox's guarantee true, so they are not a per-service preference.
    # See account-service/src/main/resources/application.yml for what each one buys.
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      retries: 2147483647
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        # Stays 'none' until the base image changes. Every codec except gzip decompresses
        # through a glibc-linked JNI library and the runtime image is Alpine/musl; the failure
        # happens inside consumer.poll(), below every error handler, and wedges the partition
        # permanently. M2 hit this for real.
        compression.type: none
        linger.ms: 5
        request.timeout.ms: 3000
        # Below the relay's send-timeout, so the send future always completes on its own rather
        # than being abandoned while the producer is still retrying in the background.
        delivery.timeout.ms: 4000
    consumer:
      # One group for the whole service. Every instance shares it, so Kafka gives each instance a
      # disjoint set of partitions: scaling out divides the work instead of duplicating it.
      group-id: payment-orchestrator

      # Start from the beginning of a topic this group has never read. The alternative,
      # 'latest', silently discards everything published before the consumer first started -
      # which on a fresh deployment means losing every event already in the log.
      auto-offset-reset: earliest

      # M6 part 4. The deserializer is WRAPPED, and this is the one layer of the poison-message
      # story M4 left open.
      #
      # Where a deserializer throws matters more than that it throws. It runs inside
      # `consumer.poll()`, BELOW the listener - so the exception arrives at the container with no
      # record attached, DefaultErrorHandler refuses it ("no record information is available"),
      # the DeadLetterPublishingRecoverer never runs, and the partition retries the same bytes
      # forever. It is the same shape as the compression trap in the producer block above: a
      # failure underneath the machinery built to catch failures.
      #
      # ErrorHandlingDeserializer catches it there instead and hands the container a record whose
      # value is null and whose headers carry the exception, which the container rethrows ABOVE
      # the listener - where the error handler can see it and route it to the dead letter topic.
      # It converts an unrecoverable partition stall into an ordinary dead letter.
      #
      # Be precise about what this does NOT buy, because the honest version is the defensible one:
      #
      #   * TODAY IT IS INERT. The delegate is StringDeserializer, which decodes bytes as UTF-8
      #     and substitutes replacement characters rather than throwing - there is no input it
      #     rejects. Malformed JSON already fails one layer higher, in Jackson inside the handler,
      #     where the error handler has always been able to see it (RetryClassifier files
      #     JacksonException as poison). So this changes no behaviour that can be observed now.
      #     It is here for the day somebody switches the delegate to JsonDeserializer to "clean
      #     up the handler" - a one-line change that silently moves parsing below the listener and
      #     re-opens the stall. Wrapping now makes that change safe instead of catastrophic.
      #
      #   * IT DOES NOT COVER DECOMPRESSION. Snappy/lz4/zstd fail while the batch is being
      #     decompressed, which is below the deserializer as well as below the listener. Nothing
      #     configured here can intercept that; only `compression.type: none` and a glibc base
      #     image can. See the producer block.
      key-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer

      # THE setting that decides whether this system can lose money.
      #
      # Left at its default of true, the client commits offsets on a five-second timer, with no
      # knowledge of whether the handler ran, succeeded, or committed its transaction. A crash
      # after an auto-commit and before the work is durable loses the message permanently: Kafka
      # believes it was delivered and will never send it again. That is at-most-once.
      #
      # False means nothing is committed until AccountEventConsumer calls acknowledge(), which it
      # does only after the handler's transaction has committed. Redelivery after a crash is then
      # guaranteed - and absorbed by the inbox.
      enable-auto-commit: false

      # Small batches, so a redelivery after a crash replays little.
      max-poll-records: 50

      properties:
        # Never let a subscribe() conjure the topic. A consumer that reaches an undeclared topic
        # first has the broker auto-create it with the broker's defaults - one partition - and is
        # then assigned only that partition, while the producer keys messages across all three.
        # Two thirds of the traffic silently goes unread until a metadata refresh five minutes
        # later. Nothing throws; the system just appears quiet. See KafkaTopicsConfig.
        allow.auto.create.topics: false
        # The real deserializers, named as delegates. Both halves are wrapped: a key that will
        # not deserialize stalls the partition exactly as a value does, and the key is the half
        # people forget because it is "just a string".
        spring.deserializer.key.delegate.class: org.apache.kafka.common.serialization.StringDeserializer
        spring.deserializer.value.delegate.class: org.apache.kafka.common.serialization.StringDeserializer

    listener:
      # Hands the listener an Acknowledgment and commits only when it is used.
      # MANUAL_IMMEDIATE rather than MANUAL: it commits at the point of the call instead of
      # deferring to the end of the poll batch, which keeps test assertions honest about what
      # has actually been committed.
      ack-mode: manual_immediate

      # M6 part 2. THIS is the half of tracing that is free, and it is worth being clear about
      # which half. Spring Kafka creates a CONSUMER observation per record and extracts the
      # `traceparent` header into it, so the handler, its JPA calls and its own outbox write all
      # land under the producing request's trace - provided the header is there. Putting it there
      # is the part that is not free, because the outbox sends on a thread that has no context;
      # see OutboxRelay and OutboxTracing.
      observation-enabled: true

    template:
      # OFF, deliberately, and it is the non-obvious setting of the pair.
      #
      # With it on, KafkaTemplate injects whatever context the SENDING thread currently holds.
      # For the outbox that thread is the relay's, so the header would describe the drain rather
      # than the payment - and it would overwrite the one the relay just injected from the stored
      # row. Two mechanisms writing the same header, the wrong one winning, and nothing anywhere
      # reporting a conflict: the trace simply comes out shaped differently from what the code
      # says.
      #
      # The relay injects explicitly instead, because it is the only thing that knows the context
      # is data on a row and not ambient on a thread.
      observation-enabled: false

# M3 relay tuning. See OutboxProperties for what each knob trades away.
dpe:
  outbox:
    batch-size: 100
    poll-interval: 500ms
    send-timeout: 5s
    # Tests turn this off and call drainBatch() directly, so nothing races them.
    scheduled: true

  saga:
    # How long a saga may sit in a non-terminal state before the sweeper forces compensation.
    #
    # This is a POLICY number and the most consequential one in the milestone. Too short and a
    # merely slow account-service gets its perfectly good reserve compensated out from under it,
    # producing a spurious failure and, worse, a release racing a late commit. Too long and money
    # sits stranded in a hold for that long whenever a participant dies. It must comfortably
    # exceed the p99 of a full round trip - relay poll interval, broker, consumer poll, the
    # gateway's own latency - and 30s is that with room to spare while staying observable in a
    # test.
    step-timeout: 30s
    # How often to look for expired sagas. The sweep is one indexed query against a partial
    # index containing only in-flight sagas, so it is cheap enough to run often.
    sweep-interval: 5s
    # Cap on how many times the sweeper will try to drive one saga to a terminal state before
    # leaving it alone and letting it be alerted on. Without a cap, a saga that cannot be
    # compensated is swept forever and the log fills with the same failure.
    max-sweep-attempts: 5
    # Sagas claimed per sweep. Bounded for the same reason the outbox batch is: the claim
    # transaction stays open across the whole batch.
    sweep-batch-size: 100
    # Tests turn this off and call sweep() directly, so a background thread cannot race them.
    scheduled: true

  # M4. Every one of these is policy, not tuning - see IdempotencyProperties.
  idempotency:
    # How long a key is honoured. Published API contract: a retry after this is a new payment.
    retention: 24h
    # Redis keeps its copy no longer than Postgres keeps the row, or the cache would answer for
    # a key the database has already forgotten.
    cache-ttl: 24h
    # The master switch. Off must change nothing but latency; the tests prove it.
    cache: true
    # Short lease. It is an optimization, and a crashed holder must not block its own retries for
    # longer than one request takes.
    lock-ttl: 3s
    # How long a caller that lost the lock waits for the winner answer before going to Postgres
    # regardless. Never refuse, never wait forever.
    lock-wait: 500ms
    # M4 part 2: garbage collection for expired keys. Frequent and small, because this table
    # is on the path of every write request and a rare enormous DELETE locks exactly the rows
    # the gate is trying to read.
    sweep-interval: 5m
    sweep-batch-size: 500
    # Tests turn this off and call sweep() directly, so nothing races them.
    scheduled: true

  # M4 part 2: retry and dead letter policy. See DeadLetterProperties for what each knob trades.
  dlq:
    # Four deliveries total, not four retries. Enough to ride out a pod restart or a brief
    # database failover; not enough for a poison message to hold its partition for long.
    max-attempts: 4
    initial-interval: 500ms
    multiplier: 2
    # Ceiling on one wait. maxAttempts x maxInterval is time the consumer is NOT polling, and
    # exceeding max.poll.interval.ms (5 minutes) makes the broker evict this consumer and
    # rebalance - which hands the partition to an instance that starts the budget again at zero.
    max-interval: 5s
    replay-batch-size: 50

  # M5: token verification. This service is the ISSUER, so it verifies with the key it signs
  # with - directly, in memory, rather than fetching its own JWKS endpoint over HTTP. Hence
  # neither jwk-set-uri nor public-key here: AuthConfig supplies the decoder. See JwtConfig for
  # the two configured paths the other services use.
  security:
    issuer: dpe
    audience: dpe-api
    clock-skew: 30s

  # M5: the ISSUING side, and it exists only in this service. A real deployment replaces this
  # with an identity provider and changes nothing else - validation is local everywhere.
  auth:
    # The revocation policy, stated as a duration. A stateless token cannot be withdrawn, so a
    # leaked one is valid for exactly this long. Fifteen minutes is the usual compromise between
    # that exposure and asking a user to log in constantly.
    token-ttl: 15m

    # THE SIGNING KEY. RSA private key (base64 PKCS#8) and its public half (base64 X.509).
    #
    # No default and no value in this file - the same rule the HS256 secret had, and for a
    # stronger reason: this one key is the ability to mint any identity in the system.
    #
    # Left unset, SigningKeys GENERATES a pair at startup and logs a warning. That keeps
    # `docker compose up` working with no key ceremony, and it is safe in a way a committed key
    # would not be, because the key never existed before the process and does not outlive it.
    # What a generated key cannot do: survive a restart (every token in flight is invalidated),
    # or be shared by two instances (each would sign with its own, and validators would reject
    # tokens from whichever one they had not fetched from). Configure a pair for anything real.
    private-key: ${DPE_AUTH_PRIVATE_KEY:}
    public-key: ${DPE_AUTH_PUBLIC_KEY:}

    # DEVELOPMENT DIRECTORY. Fake people, fake passwords, plain text - a real user store holds a
    # slow hash (bcrypt/argon2) and lives in a database, and nothing here should be mistaken for
    # one. The subjects are deliberately the same strings as accounts.owner_id, which is what
    # lets `sub` be compared directly against ownership with no mapping table in between.
    users:
      alice:
        password: ${DEV_PASSWORD_ALICE:alice-password}
        roles: [USER]
      bob:
        password: ${DEV_PASSWORD_BOB:bob-password}
        roles: [USER]
      # Reads the operational surfaces and replays dead letters. Cannot move money - not by
      # policy in a document, but because AccountOwnershipGuard has no role bypass and this
      # subject owns no accounts.
      operator:
        password: ${DEV_PASSWORD_OPERATOR:operator-password}
        roles: [OPERATOR]

server:
  port: ${SERVER_PORT:8081}

management:
  # M6. The actuator moves to its own connector, which infra/docker-compose.yml deliberately does
  # NOT publish: Prometheus scrapes it across the Compose network and the host cannot reach it at
  # all. That is the whole scrape-credential decision - no token, no basic auth, a network boundary
  # stated the same way this system already states the one around dpe.account.commands.v1.
  #
  # Overridable because tests collapse it back onto the application port: with one connector there
  # is nothing to tell apart, ManagementPortMatcher matches nothing, and the M5 operator-only rule
  # governs the actuator exactly as it did before. That is the fail-closed direction.
  server:
    port: ${MANAGEMENT_PORT:9091}

  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true

  # M6 part 2: tracing.
  tracing:
    sampling:
      # ONE. Every request is traced, and that is a laptop decision, not a production one.
      #
      # Sampling is the cost control for tracing the way cardinality is for metrics: a span is
      # kilobytes, not a counter increment, and 1.0 through a real payment volume is a bill and a
      # collector that falls over. Production sits at a few percent, plus tail-based sampling in
      # the collector so the slow and failed traces - the only ones anybody ever opens - are kept
      # regardless of the dice.
      #
      # What matters for THIS system is that the decision is made ONCE, at the edge, and then
      # carried: the sampled flag is the last two hex digits of `traceparent`, so it travels in
      # the outbox row along with everything else. Downstream services do not re-roll. If they
      # did, a payment would be sampled at the orchestrator and dropped at account-service, and
      # every trace would be a fragment ending wherever the dice went the other way.
      probability: ${TRACING_SAMPLE_RATE:1.0}

    propagation:
      # PINNED, not left to default, because this format is now written into a database column.
      # `outbox.trace_parent` is a VARCHAR(55) shaped exactly like a W3C traceparent; switching
      # the propagator to B3 would keep compiling, keep passing tests, and start storing a value
      # of a different shape that the other end silently fails to extract.
      type: w3c

  # NOT `management.otlp.tracing.endpoint`, which is what every tutorial and every Boot 3 answer
  # says. Boot 4.0 moved the whole OTLP family under `management.opentelemetry.*` and marked the
  # old keys deprecated at level ERROR - they no longer bind. A service left on the old key starts
  # perfectly happily and exports to the OTLP default of http://localhost:4318, which inside a
  # container is the container itself: no Jaeger, no error anyone will notice, and an empty UI
  # that looks like an instrumentation bug rather than a renamed property.
  opentelemetry:
    tracing:
      export:
        otlp:
          # Jaeger ingests OTLP directly - there has been no separate Jaeger wire protocol worth
          # using since 1.35, and the old route through its Zipkin-compatible port is a
          # translation nobody needs.
          #
          # HTTP (4318) rather than gRPC (4317): one less protocol in the runtime image, and a
          # wrong port fails as a visible connection refused rather than a stream into nothing.
          endpoint: ${OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}

  metrics:
    tags:
      # Stamped on every meter this process publishes. Prometheus also attaches `job` and
      # `instance` from its own scrape config, and those are the SCRAPER's opinion about who this
      # is; `application` is the application's own claim, and it is the one that survives
      # federation, remote_write, and someone rewriting prometheus.yml. Dashboards group on this.
      application: payment-orchestrator

    web:
      server:
        # THE cardinality guard, and the one that actually fires in production. Every distinct URI
        # is a label value, so a path with an id in it - /api/v1/transfers/{id} - is one time
        # series per transfer if the URI is not templated. Boot templates it correctly; a
        # hand-written filter or a 404 to a random path does not. On hitting this ceiling
        # Micrometer stops adding URIs and logs, instead of quietly growing until Prometheus dies.
        max-uri-tags: 50

    distribution:
      # A histogram is what makes a real quantile possible: Prometheus computes p99 across
      # instances from _bucket series, whereas a client-side `percentiles` is pre-computed per
      # process and CANNOT be averaged or summed - averaging two p99s is not a p99 of anything.
      # So: buckets here, percentiles never.
      percentiles-histogram:
        http.server.requests: true
        dpe.saga.duration: true
      # Buckets are not free - each boundary is its own time series, multiplied by every other
      # label. Bounding the range keeps that count near 30 per meter instead of the ~70 the
      # default range generates, and the bounds are chosen to bracket what these actually do.
      minimum-expected-value:
        http.server.requests: 5ms
        dpe.saga.duration: 50ms
      maximum-expected-value:
        http.server.requests: 5s
        # A saga outlives its HTTP response, so its ceiling is the timeout sweeper's horizon,
        # not a request timeout.
        dpe.saga.duration: 60s

logging:
  level:
    com.dpe: DEBUG
