# Redpanda: one broker. Flags mirror infra/docker-compose.yml - read the comments there for why each
# one exists; only what differs is explained here.
#
# Cluster properties (write caching off, auto-creation off) come from infra/redpanda/bootstrap.yaml,
# mounted through the `redpanda-bootstrap` ConfigMap that k8s/up.sh creates from that file. Same
# trap as Compose: it is read only when the cluster is FIRST created, which here means when the PVC
# is new. Verify with:
#   kubectl --context kind-dpe -n dpe-infra exec redpanda-0 -- rpk cluster config get write_caching_default
apiVersion: v1
kind: Service
metadata:
  name: redpanda
  namespace: dpe-infra
  labels:
    app.kubernetes.io/name: redpanda
spec:
  # Headless: DNS answers with the pod itself, which is what gives redpanda-0 a stable name to
  # advertise. publishNotReadyAddresses so the name resolves while the broker is still starting.
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: redpanda
  ports:
    - name: kafka
      port: 9092
      targetPort: kafka
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redpanda
  namespace: dpe-infra
spec:
  serviceName: redpanda
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: redpanda
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redpanda
        app.kubernetes.io/part-of: dpe
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      containers:
        - name: redpanda
          image: redpandadata/redpanda:v25.3.17
          args:
            - redpanda
            - start
            # ONE listener. Compose needs two because the host dials the broker by a different
            # name than containers do; nothing outside this cluster talks to this broker.
            - --kafka-addr=internal://0.0.0.0:9092
            # The M2 lesson again: a client does not stay on the address it dialled, it reconnects
            # to whatever this says. It must be a name that resolves from every pod that consumes,
            # in every namespace - hence fully qualified. Get it wrong and bootstrap succeeds while
            # every produce afterwards hangs on an unresolvable host.
            - --advertise-kafka-addr=internal://redpanda-0.redpanda.dpe-infra.svc.cluster.local:9092
            - --smp=1
            # Below the memory limit, not equal to it - see Compose for the seastar error.
            - --memory=384M
            - --reserve-memory=0M
            - --overprovisioned
            - --node-id=0
            - --check=false
          ports:
            - name: kafka
              containerPort: 9092
          volumeMounts:
            - name: data
              mountPath: /var/lib/redpanda/data
            - name: bootstrap
              mountPath: /etc/redpanda/.bootstrap.yaml
              subPath: bootstrap.yaml
              readOnly: true
          readinessProbe:
            exec:
              command: ["sh", "-c", "rpk cluster health 2>/dev/null | grep -qE 'Healthy:.*true'"]
            periodSeconds: 5
            timeoutSeconds: 5
          # Liveness asks only whether the admin API answers at all - not whether the cluster is
          # healthy. A broker waiting on something is not fixed by being restarted.
          livenessProbe:
            httpGet:
              path: /v1/status/ready
              port: 9644
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 512Mi
      volumes:
        - name: bootstrap
          configMap:
            name: redpanda-bootstrap
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi
