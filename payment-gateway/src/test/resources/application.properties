# M5: test-only configuration.
#
# In its own file rather than in each @SpringBootTest's properties, because of the trap M4 found:
# @SpringBootTest properties do NOT merge down a class hierarchy - Spring takes the first
# declaration it finds and ignores the rest - so a key added to a base class quietly disappears
# from any subclass that re-declares its own properties. A test-classpath application.properties
# is merged with the main application.yml by normal config-data precedence and cannot be lost
# that way.
#
# The signing key exists ONLY here and in docker-compose. It is not in application.yml, and a
# service with no DPE_SECURITY_SECRET refuses to start - see SecurityProperties.
dpe.security.secret=test-signing-key-that-is-long-enough-for-hs256
