# M5: test-only configuration.
#
# In its own file rather than in each @SpringBootTest's properties, because of the trap M4 found:
# @SpringBootTest properties do NOT merge down a class hierarchy - Spring takes the first
# declaration it finds and ignores the rest - so a key added to a base class quietly disappears
# from any subclass that re-declares its own properties. A test-classpath application.properties
# is merged with the main application.yml by normal config-data precedence and cannot be lost
# that way.
#
# M5 part 2: there is no shared secret any more. Services verify with a PUBLIC key, and the
# private half exists only inside payment-orchestrator. The orchestrator's tests use the key it
# generates at startup; account-service and payment-gateway are handed a generated test public key
# through @DynamicPropertySource in their AbstractPostgresIT, because it cannot be written here -
# it does not exist until the JVM starts.

# M6: collapse the actuator back onto the application port for the test suite.
#
# In production the actuator listens on its own connector and SecurityConfig#managementChain
# permits it, because Compose does not publish that port. A test JVM has no such network boundary,
# so opening a second unauthenticated connector here would be a hole that exists only in tests -
# and, worse, would silently REPLACE the M5 rule the actuator security tests are asserting.
#
# With management.server.port equal to server.port there is no second connector,
# ManagementPortMatcher matches nothing, and /actuator/** is operator-only exactly as M5 left it.
# That is the fail-closed branch of the matcher, exercised by the whole suite on every run.
#
# ManagementPortSecurityIT is the exception: it sets a real, distinct port through
# @DynamicPropertySource and asserts the two-connector posture directly.
management.server.port=8083

# M6: the metrics refreshers are off for tests, like every other background timer here.
#
# MessagingMetricsScheduler and SagaMetricsScheduler only READ, so leaving them on could not
# corrupt anything - but a timer firing queries at a table a test is truncating produces log
# noise and the occasional confusing stack trace, and a gauge refreshed behind an assertion
# makes that assertion depend on thread scheduling. The tests that care call refresh() directly,
# which is also the only way to assert on a value at a known point.
#
# In this file rather than in a @SpringBootTest properties list, for the M4 reason: those do not
# merge down a class hierarchy, so a subclass re-declaring its own would silently turn these back
# on.
dpe.metrics.scheduled=false
