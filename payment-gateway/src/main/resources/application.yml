spring:
  application:
    name: payment-gateway

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/gateway_db}
    username: ${DB_USER:gateway}
    password: ${DB_PASSWORD:gateway}
    hikari:
      maximum-pool-size: 10
      pool-name: gateway-pool

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  # M3: the gateway joins the saga. It consumes ChargeGateway commands and produces
  # GatewayApproved / GatewayDeclined events out of its own outbox.
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:19092}

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      retries: 2147483647
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        # 'none' until the base image stops being musl. See account-service's yml.
        compression.type: none
        linger.ms: 5
        request.timeout.ms: 3000
        delivery.timeout.ms: 4000

    consumer:
      group-id: payment-gateway
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # Nothing is committed until the handler's transaction has committed. Auto-commit would
      # acknowledge a charge command on a timer, with no idea whether the charge happened.
      enable-auto-commit: false
      max-poll-records: 50
      properties:
        # A consumer must never conjure a topic. See KafkaTopicsConfig in any service for the
        # silent one-partition failure this prevents.
        allow.auto.create.topics: false

    listener:
      ack-mode: manual_immediate

# M3 relay tuning. See OutboxProperties for what each knob trades away.
dpe:
  outbox:
    batch-size: 100
    poll-interval: 500ms
    send-timeout: 5s
    scheduled: true

  # M4 part 2: retry and dead letter policy. See DeadLetterProperties for what each knob trades.
  dlq:
    # Four deliveries total, not four retries. Enough to ride out a pod restart or a brief
    # database failover; not enough for a poison message to hold its partition for long.
    max-attempts: 4
    initial-interval: 500ms
    multiplier: 2
    # Ceiling on one wait. maxAttempts x maxInterval is time the consumer is NOT polling, and
    # exceeding max.poll.interval.ms (5 minutes) makes the broker evict this consumer and
    # rebalance - which hands the partition to an instance that starts the budget again at zero.
    max-interval: 5s
    replay-batch-size: 50

server:
  port: ${SERVER_PORT:8083}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true

# Runtime-tunable fault injection. These are what the chaos suite manipulates at M7 to force
# the orchestrator down its compensation path on demand.
gateway:
  simulation:
    failure-rate: ${GATEWAY_FAILURE_RATE:0.0}
    latency-ms: ${GATEWAY_LATENCY_MS:50}
    timeout-rate: ${GATEWAY_TIMEOUT_RATE:0.0}
    duplicate-callback-rate: ${GATEWAY_DUPLICATE_RATE:0.0}

logging:
  level:
    com.dpe: DEBUG
