spring:
  application:
    name: payment-gateway

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/gateway_db}
    username: ${DB_USER:gateway}
    password: ${DB_PASSWORD:gateway}
    hikari:
      maximum-pool-size: 10
      pool-name: gateway-pool

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8083}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true

# Runtime-tunable fault injection. These are what the chaos suite manipulates at M7 to force
# the orchestrator down its compensation path on demand.
gateway:
  simulation:
    failure-rate: ${GATEWAY_FAILURE_RATE:0.0}
    latency-ms: ${GATEWAY_LATENCY_MS:50}
    timeout-rate: ${GATEWAY_TIMEOUT_RATE:0.0}
    duplicate-callback-rate: ${GATEWAY_DUPLICATE_RATE:0.0}

logging:
  level:
    com.dpe: DEBUG
