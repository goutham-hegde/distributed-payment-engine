spring:
  application:
    name: account-service

  datasource:
    # Env-driven with localhost defaults, so the same jar runs from your IDE and from Compose.
    url: ${DB_URL:jdbc:postgresql://localhost:5432/accounts_db}
    username: ${DB_USER:accounts}
    password: ${DB_PASSWORD:accounts}
    hikari:
      # Deliberately small. A connection pool larger than the DB can serve just moves the
      # queue from your app into Postgres, where it is harder to see. Revisit at M8 with
      # real load-test numbers rather than guessing now.
      maximum-pool-size: 10
      pool-name: account-pool

  jpa:
    # Flyway owns the schema. Hibernate must never alter it - 'validate' makes a drift between
    # entities and migrations fail loudly at boot instead of silently corrupting data.
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  # M2: the outbox relay is the only thing in this service that talks to Kafka.
  kafka:
    # In Compose this is redpanda:9092 (the internal listener). From the IDE it is
    # localhost:19092 (the external one). Same broker, two advertised addresses.
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:19092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      # The payload was already serialized to JSON inside the business transaction, so the
      # producer is handed a String and does no mapping. A JsonSerializer here would move
      # serialization to publish time, where a failure can no longer roll anything back.
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

      # Wait for every in-sync replica, not just the partition leader. With acks=1 a write is
      # acknowledged by the leader alone, and if that leader dies before its followers catch up
      # the acknowledged message is gone - the relay has already marked the row published, so
      # nothing will ever resend it. This is the setting that makes the outbox's guarantee true.
      # (On this single-broker dev cluster "all replicas" is one machine. It is honest to say
      # that acks=all is doing nothing for durability here; it is set so that the code is correct
      # on the cluster it would actually run on.)
      acks: all
      retries: 2147483647
      properties:
        # Deduplicates the producer's OWN retries within a session, by tagging records with a
        # producer id and sequence number so the broker can drop a redelivery it has already
        # written. Worth having - it removes the commonest source of duplicates. It is NOT
        # end-to-end exactly-once: it knows nothing about the relay crashing and republishing
        # from the outbox, which is a different producer session with different sequence numbers.
        # That case is the consumer's inbox's job.
        enable.idempotence: true
        # Idempotence permits up to 5 in flight while still guaranteeing order on retry. Above
        # 5 the broker cannot deduplicate reliably and Kafka refuses to start with idempotence on.
        max.in.flight.requests.per.connection: 5
        # Explicit, because the runtime image cannot support anything else. Every Kafka codec
        # except gzip - snappy, lz4, zstd - decompresses through a bundled JNI library, and the
        # service image is eclipse-temurin:21-jre-alpine, which is musl: the .so is glibc-linked
        # and fails to load with "Error loading shared library ld-linux-x86-64.so.2".
        #
        # The way it fails is what makes this worth pinning. Decompression happens inside
        # consumer.poll(), BELOW the listener, so the failure arrives as a KafkaException with no
        # record attached - DefaultErrorHandler refuses it ("no record information is available"),
        # no error handler and no future DLQ can intercept it, and the partition spins on that
        # record forever. Recovery is a manual offset seek. Turning compression on for throughput
        # therefore needs a glibc base image FIRST.
        compression.type: none
        linger.ms: 5
        request.timeout.ms: 3000
        # Total budget for one send, retries included. Kept BELOW the relay's send-timeout on
        # purpose: the future then always completes on its own, exceptionally if need be, rather
        # than leaving the relay to time out while the producer is still retrying in the
        # background - which would publish a message the relay had already given up on.
        delivery.timeout.ms: 4000

    # M3: this service now CONSUMES too - the saga commands the orchestrator issues to it.
    consumer:
      # One group for the whole service, so scaling out divides the partitions rather than
      # duplicating the commands.
      group-id: account-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # Nothing is committed until AccountCommandHandler's transaction has. Auto-commit would
      # acknowledge a ReserveFunds on a five-second timer with no idea whether the money moved.
      enable-auto-commit: false
      max-poll-records: 50
      properties:
        # A consumer must never conjure a topic. See KafkaTopicsConfig for the silent
        # one-partition stall this prevents.
        allow.auto.create.topics: false

    listener:
      ack-mode: manual_immediate

# M2 relay tuning. See OutboxProperties for what each knob actually trades away.
dpe:
  outbox:
    batch-size: 100
    poll-interval: 500ms
    send-timeout: 5s
    # Tests turn this off and call drainBatch() directly, so nothing races them.
    scheduled: true

  # M4 part 2: retry and dead letter policy. See DeadLetterProperties for what each knob trades.
  dlq:
    # Four deliveries total, not four retries. Enough to ride out a pod restart or a brief
    # database failover; not enough for a poison message to hold its partition for long.
    max-attempts: 4
    initial-interval: 500ms
    multiplier: 2
    # Ceiling on one wait. maxAttempts x maxInterval is time the consumer is NOT polling, and
    # exceeding max.poll.interval.ms (5 minutes) makes the broker evict this consumer and
    # rebalance - which hands the partition to an instance that starts the budget again at zero.
    max-interval: 5s
    replay-batch-size: 50

  # M5: token validation. Every service binds this block identically - see common-security.
  #
  # NOTE WHAT IS NOT HERE: `secret`. It has no default and no value in this file, on purpose.
  # A signing key committed to a repository is a published signing key, and "it is only the dev
  # default" stops being true the first time a deployment inherits it. Supply it as the
  # environment variable DPE_SECURITY_SECRET (Boot's relaxed binding maps it to
  # dpe.security.secret with no entry here); infra/docker-compose.yml sets a throwaway one.
  #
  # Absent, the service REFUSES TO START, with a message naming the key and the minimum length -
  # see SecurityProperties. That is the intended behaviour: an authentication system that boots
  # without a key would have to either invent one or switch itself off, and both are worse than
  # not starting.
  security:
    issuer: dpe
    audience: dpe-api
    # Leeway on exp/nbf. Stateless auth makes clock agreement a correctness dependency; without
    # some leeway a validator whose clock runs fast rejects freshly issued tokens and reports it
    # as "expired". Small, because every second of it is a second an expired token still works.
    clock-skew: 30s

server:
  port: ${SERVER_PORT:8082}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true

logging:
  level:
    com.dpe: DEBUG
