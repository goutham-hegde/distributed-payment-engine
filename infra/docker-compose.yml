# M0 stack: PostgreSQL plus the three services.
# M2 adds Redpanda - the transactional outbox needs somewhere to relay messages to.
# M4 adds Redis - the idempotency fast path, and the only container here that can be
# killed without the system becoming incorrect.
#
# Prometheus/Grafana/Jaeger arrive at M6 - each container shows up in the commit that
# first needs it, so nothing here is unexplained.
#
# Run from the repo root:  docker compose -f infra/docker-compose.yml up -d
#                          docker compose -f infra/docker-compose.yml --profile kafka up -d

name: dpe

# Hoisted out of the service blocks so the heap cap is stated once. As of M3 all three
# services speak Kafka - the gateway joined the saga and got its KAFKA_BOOTSTRAP here.
# M5 part 2: the other two services trust payment-orchestrator's signing key and fetch its
# PUBLIC half from the JWK set it publishes. There is no shared secret any more - part 1 had one,
# and it meant every service that could verify a token could also mint one.
#
# Lazy and cached: account-service and payment-gateway boot fine before the orchestrator is up,
# and only fetch when they are first asked to verify a token.
#
# The orchestrator does NOT get this - it verifies with the key it signs with. Its private key is
# unset here on purpose, so SigningKeys generates an ephemeral pair and says so in the log. That
# is right for a laptop and wrong for anything with two instances or an uptime requirement; a real
# deployment sets DPE_AUTH_PRIVATE_KEY / DPE_AUTH_PUBLIC_KEY from a secret store.
x-jwks-env: &jwks-env
  DPE_SECURITY_JWK_SET_URI: http://payment-orchestrator:8081/.well-known/jwks.json

x-jvm-env: &jvm-env
  # Explicit heap cap. Three JVMs at default sizing will each claim a quarter
  # of the container's visible RAM and this machine cannot afford that.
  JAVA_TOOL_OPTIONS: "-Xmx256m -XX:+UseSerialGC"

x-build-ctx: &build-ctx
  context: ..
  dockerfile: Dockerfile

# M6 moved this. The actuator now listens on MANAGEMENT_PORT, not SERVER_PORT, so a probe pointed
# at the application port gets a 404 - which Compose reports only as "unhealthy", with no hint that
# the endpoint merely moved. The same correction is due for the K8s probes at M10.
x-health: &health
  test: ["CMD-SHELL", "wget -qO- http://localhost:$${MANAGEMENT_PORT}/actuator/health | grep -q '\"status\":\"UP\"'"]
  interval: 10s
  timeout: 5s
  retries: 12
  start_period: 45s

x-mem-limit: &mem-limit
  resources:
    limits:
      memory: 512M

services:

  postgres:
    image: postgres:16-alpine
    container_name: dpe-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Runs only on first init of the volume. `docker compose down -v` to re-run it.
      - ./postgres/init-databases.sh:/docker-entrypoint-initdb.d/10-init-databases.sh:ro
    healthcheck:
      # `depends_on` alone waits only for the container to exist. Postgres accepts
      # TCP connections seconds before it can serve queries, so without this the
      # services crash-loop on startup and it looks like a Flyway bug.
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    deploy: *mem-limit

  # Kafka API, one binary, no ZooKeeper and no JVM. Chosen over Apache Kafka as the default
  # because it idles at a fraction of the memory on a 16 GB machine - see the `kafka` profile
  # below for the real thing, which the same code must also pass against.
  redpanda:
    image: redpandadata/redpanda:v25.3.17
    container_name: dpe-redpanda
    command:
      - redpanda
      - start
      # Two listeners, because containers and the host reach the broker by different names.
      # A Kafka client does not talk to the address it dialled: it fetches metadata, and then
      # connects to whatever `advertise-kafka-addr` told it. Get this wrong and the bootstrap
      # succeeds while every produce and fetch afterwards hangs on an unresolvable host - the
      # single most common Kafka-in-Docker failure, and it looks nothing like a DNS problem.
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:19092
      - --smp=1
      # MUST be below the container's memory limit below, not equal to it. Seastar allocates
      # this much up front and refuses to start if the cgroup cannot hand it over:
      #   "Could not initialize seastar: insufficient physical memory:
      #    needed 536870912 available 500000000"
      # with --memory=512M under a 512M limit. The gap is the runtime's own overhead - the rpk
      # wrapper, the page cache, the allocator's metadata - which comes out of the same cgroup.
      # 384M under a 512M cap leaves that headroom.
      - --memory=384M
      - --reserve-memory=0M
      # Skips the production readiness checks (open file limits, memory locking). Correct for
      # a laptop, never for production.
      - --overprovisioned
      - --node-id=0
      - --check=false
      # A topic is a declared artifact, never something the first client to ask for it brings
      # into existence. With auto-creation on, whichever service connects first silently
      # defines the topic's shape - and a consumer that wins that race creates it with ONE
      # partition, is assigned only that partition, and then never sees the messages the
      # producer keys onto the other two. Off, an undeclared topic is an error someone can see.
      - --set redpanda.auto_create_topics_enabled=false
    ports:
      # Host-facing listener only. Services inside the network use redpanda:9092.
      - "19092:19092"
    healthcheck:
      # A broker that accepts TCP is not a broker that can serve a produce request; the
      # controller has to have elected a leader first. Same lesson as pg_isready above.
      test: ["CMD-SHELL", "rpk cluster health 2>/dev/null | grep -qE 'Healthy:.*true'"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    deploy: *mem-limit

  # The same broker, for real. Apache Kafka in KRaft mode - no ZooKeeper either, since 3.3.
  # Profile-gated: `--profile kafka` and stop redpanda first, as both claim host port 19092.
  # The point of keeping it is that "works on Redpanda" is not "works on Kafka", and the
  # chaos suite at M7 should be able to prove the difference.
  kafka:
    image: apache/kafka:4.3.1
    container_name: dpe-kafka
    profiles: ["kafka"]
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_LISTENERS: "INTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,EXTERNAL://0.0.0.0:19092"
      KAFKA_ADVERTISED_LISTENERS: "INTERNAL://kafka:9092,EXTERNAL://localhost:19092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: "INTERNAL"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      # A single-broker cluster cannot replicate. These default to 3 and every internal
      # topic creation fails with a replication-factor error until they are set to 1.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_HEAP_OPTS: "-Xmx512m -Xms256m"
    ports:
      - "19092:19092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 1G

  # M4. The idempotency fast path and the anti-stampede lock, and NOTHING that the system's
  # correctness rests on: the guarantee is the PRIMARY KEY on idempotency_records. That claim is
  # meant to be tested, not asserted - `docker compose stop redis` and the API keeps answering,
  # keeps deduplicating retries, and gets slower. If it ever does anything else, the design has
  # drifted and IdempotencyCache is the place to look.
  #
  # Deliberately no volume. This data is a copy of rows in Postgres; persisting it across
  # restarts would buy a warm cache in exchange for a store that can disagree with the database
  # after a restore. Empty on boot is the correct state for a cache.
  redis:
    image: redis:7-alpine
    container_name: dpe-redis
    command:
      # No RDB snapshots and no AOF. Same reasoning as the missing volume, and it also keeps
      # Redis off the disk entirely on a machine where Postgres wants all of it.
      - redis-server
      - --save
      - ""
      - --appendonly
      - "no"
      # A hard ceiling, because an unbounded cache on a 16 GB laptop is a memory leak with good
      # intentions. allkeys-lru rather than the default noeviction: when full, a cache must
      # forget something, not start refusing writes. noeviction would make `SET` fail, which the
      # gate survives - it just stops caching - but silently and forever.
      - --maxmemory
      - 64mb
      - --maxmemory-policy
      - allkeys-lru
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    deploy:
      resources:
        limits:
          memory: 128M

  payment-orchestrator:
    build:
      <<: *build-ctx
      args:
        MODULE: payment-orchestrator
    container_name: dpe-orchestrator
    depends_on:
      postgres:
        condition: service_healthy
      redpanda:
        condition: service_healthy
      # service_started, NOT service_healthy, and the difference is the design in one line. The
      # orchestrator must boot and serve requests with Redis missing entirely; making startup
      # wait on a healthy Redis would turn the cache into a hard dependency in the one place it
      # is easiest to do by accident.
      redis:
        condition: service_started
    environment:
      <<: *jvm-env
      DB_URL: jdbc:postgresql://postgres:5432/payments_db
      DB_USER: payments
      DB_PASSWORD: payments
      KAFKA_BOOTSTRAP: redpanda:9092
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      SERVER_PORT: "8081"
      # M6. Deliberately absent from every `ports:` block: reachable from prometheus
      # across this network and from nowhere else. See SecurityConfig#managementChain.
      MANAGEMENT_PORT: "9091"
    ports:
      - "8081:8081"
    healthcheck: *health
    deploy: *mem-limit

  account-service:
    build:
      <<: *build-ctx
      args:
        MODULE: account-service
    container_name: dpe-account
    depends_on:
      postgres:
        condition: service_healthy
      redpanda:
        condition: service_healthy
    environment:
      <<: [*jvm-env, *jwks-env]
      DB_URL: jdbc:postgresql://postgres:5432/accounts_db
      DB_USER: accounts
      DB_PASSWORD: accounts
      KAFKA_BOOTSTRAP: redpanda:9092
      SERVER_PORT: "8082"
      # M6. Deliberately absent from every `ports:` block: reachable from prometheus
      # across this network and from nowhere else. See SecurityConfig#managementChain.
      MANAGEMENT_PORT: "9092"
    ports:
      - "8082:8082"
    healthcheck: *health
    deploy: *mem-limit

  payment-gateway:
    build:
      <<: *build-ctx
      args:
        MODULE: payment-gateway
    container_name: dpe-gateway
    depends_on:
      postgres:
        condition: service_healthy
      # M3: the gateway joined the saga, so it now needs the broker at startup like the other
      # two - it declares its topics before its listener subscribes.
      redpanda:
        condition: service_healthy
    environment:
      <<: [*jvm-env, *jwks-env]
      DB_URL: jdbc:postgresql://postgres:5432/gateway_db
      DB_USER: gateway
      DB_PASSWORD: gateway
      KAFKA_BOOTSTRAP: redpanda:9092
      SERVER_PORT: "8083"
      # M6. Deliberately absent from every `ports:` block: reachable from prometheus
      # across this network and from nowhere else. See SecurityConfig#managementChain.
      MANAGEMENT_PORT: "9093"
      # Default to a gateway that always approves, so `compose up` gives a working happy path.
      # The chaos suite turns these up at runtime via POST /admin/simulation.
      GATEWAY_FAILURE_RATE: "0.0"
      GATEWAY_LATENCY_MS: "50"
    ports:
      - "8083:8083"
    healthcheck: *health
    deploy: *mem-limit

  # ---------------------------------------------------------------------------------------
  # M6: observability. Both containers are pure consumers of what the services already
  # publish - stopping either one changes nothing about how a payment behaves, which is the
  # test of whether monitoring has quietly become load-bearing.
  # ---------------------------------------------------------------------------------------

  prometheus:
    image: prom/prometheus:v3.7.3
    container_name: dpe-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      # Retention is a statement about which questions can still be asked, and it is the same
      # kind of statement as the one on idempotency_records: bounded on purpose, and bounded
      # where the boundary is defensible. 24h covers "what happened during the chaos run I did
      # this morning" and nothing longer, which is all a laptop should promise.
      - --storage.tsdb.retention.time=24h
      # NOT passing --web.enable-lifecycle, rather than passing it as false. Prometheus 3's
      # flag parser rejects `--web.enable-lifecycle=false` outright ("unexpected false") - these
      # are presence flags, and the negative form is `--no-web.enable-lifecycle`. Absent is
      # already the secure default: no reload endpoint, and no admin API that could delete series.
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - promdata:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      # service_started, not service_healthy. Prometheus must come up and SHOW targets as down;
      # waiting for the services would hide exactly the startup window worth watching.
      payment-orchestrator:
        condition: service_started
      account-service:
        condition: service_started
      payment-gateway:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9090/-/healthy | grep -q Healthy"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 384M

  grafana:
    image: grafana/grafana:12.3.1
    container_name: dpe-grafana
    environment:
      # Anonymous viewer with the Admin role, and no login page. This is a laptop demo whose
      # entire audience is the person running it; a password prompt in front of a dashboard of
      # data that is already unauthenticated on the Compose network protects nothing and gets
      # in the way of the screenshot this milestone exists to produce.
      #
      # It is also exactly the kind of thing that must never be copied to a deployment, so it
      # is stated here rather than hidden in a volume: GF_AUTH_ANONYMOUS_ORG_ROLE=Admin means
      # anyone who can reach port 3000 can edit and query. Only true because port 3000 is
      # reachable from this machine alone.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Admin"
      GF_AUTH_BASIC_ENABLED: "false"
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      # Land on the payments dashboard rather than an empty home page.
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/dpe-payments.json
      # Nothing here should phone home from a portfolio project.
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health | grep -q '\"database\": *\"ok\"'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 320M

volumes:
  pgdata:
  promdata:
  grafanadata:
